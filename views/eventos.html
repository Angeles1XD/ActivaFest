<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Eventos - ActivaFest</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

<header>
  <h1>ActivaFest - Eventos</h1>
  <nav>
    <a href="../index.html">Inicio</a>
  </nav>
</header>

<section class="buscador">
  <input type="text" id="buscar" placeholder="Buscar eventos...">
  <button id="btnBuscar">Buscar</button>
</section>

<section id="eventos" class="eventos"></section>

<script type="module">
import { mostrarEventos, buscarEventos } from "../controllers/eventosController.js";

const input = document.getElementById("buscar");
const boton = document.getElementById("btnBuscar");

// mostrar todos al inicio
mostrarEventos();

// buscar
boton.addEventListener("click", () => {
  const texto = input.value;
  const filtrados = buscarEventos(texto);
  mostrarEventos(filtrados);
});
</script>

</body>
</html>
