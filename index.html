<!DOCTYPE html>
<html>
<head>
  <title>ActivaFest</title>

  <style>
    body{
      font-family: Arial;
      background:#0f0f1a;
      color:white;
      padding:20px;
    }

    .evento{
      background:#1e1e2f;
      padding:10px;
      margin:5px;
      border-radius:10px;
    }

    input, button{
      padding:10px;
      margin:5px;
      border-radius:10px;
      border:none;
    }

    button{
      background:#ff4d8d;
      color:white;
    }
  </style>

</head>
<body>

<h1>ActivaFest 🎉</h1>

<!-- ➕ PUBLICAR EVENTO -->
<h2>Publicar evento</h2>

<input type="text" id="titulo" placeholder="Título">
<input type="text" id="descripcion" placeholder="Descripción">

<button onclick="publicar()">Publicar evento</button>

<!-- 📋 LISTA -->
<h2>Eventos publicados</h2>
<div id="listaEventos"></div>

<script>

let eventos = [];

// ➕ PUBLICAR
function publicar(){
  let titulo = document.getElementById("titulo").value;
  let descripcion = document.getElementById("descripcion").value;

  if(titulo === "" || descripcion === ""){
    alert("Completa los campos");
    return;
  }

  let evento = {titulo, descripcion};
  eventos.push(evento);

  mostrarEventos();

  document.getElementById("titulo").value = "";
  document.getElementById("descripcion").value = "";
}

// MOSTRAR
function mostrarEventos(){
  let contenedor = document.getElementById("listaEventos");
  contenedor.innerHTML = "";

  eventos.forEach(e => {
    let div = document.createElement("div");
    div.className = "evento";
    div.innerText = e.titulo;

    contenedor.appendChild(div);
  });
}

</script>

</body>
</html>
