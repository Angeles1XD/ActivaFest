<!DOCTYPE html>
<html>
<head>
  <title>ActivaFest</title>

  <style>
    body{
      font-family: Arial;
      background:#0f0f1a;
      color:white;
      padding:20px;
    }

    .evento{
      background:#1e1e2f;
      padding:10px;
      margin:5px;
      border-radius:10px;
      cursor:pointer;
    }
  </style>

</head>
<body>

<h1>ActivaFest 🎉</h1>

<h2>Lista de eventos</h2>
<div id="listaEventos"></div>

<h2>Información del evento</h2>
<p id="detalle">Haz clic en un evento</p>

<script>

let eventos = [
  {titulo:"Concierto juvenil", descripcion:"Música en vivo"},
  {titulo:"Festival de danza", descripcion:"Baile urbano"},
  {titulo:"Feria tecnológica", descripcion:"Innovación tecnológica"}
];

// MOSTRAR EVENTOS
function mostrarEventos(){
  let contenedor = document.getElementById("listaEventos");
  contenedor.innerHTML = "";

  eventos.forEach((evento, index) => {
    let div = document.createElement("div");
    div.className = "evento";
    div.innerText = evento.titulo;

    // 📄 MOSTRAR INFORMACIÓN
    div.onclick = () => {
      document.getElementById("detalle").innerText =
        "Título: " + evento.titulo + " | Descripción: " + evento.descripcion;
    };

    contenedor.appendChild(div);
  });
}

mostrarEventos();

</script>

</body>
</html>
